<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IamSpino">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f0f0f">
<title>IamSpino Coaching</title>
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<!-- Firebase SDK compat (funziona sia in Electron che in browser) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#161616;--surface2:#1e1e1e;--surface3:#252525;
  --border:#2a2a2a;--border2:#333;
  --accent:#f5c518;--accent2:#e05c2a;--accent3:#4caf50;--accentBlue:#4a9eff;
  --text:#efefef;--muted:#666;--muted2:#888;
  --radius:7px;--radiusLg:12px;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;height:100vh;overflow:hidden;display:flex}

/* NAV */
nav{width:224px;min-width:224px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.nav-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.nav-logo-inner{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.nav-logo h1{font-family:'Bebas Neue',cursive;font-size:16px;letter-spacing:2px;color:var(--accent);line-height:1.1}
.nav-logo .sub{font-family:'Bebas Neue',cursive;font-size:10px;letter-spacing:3px;color:var(--accent);opacity:.6}
.nav-logo small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px;font-family:'DM Sans',sans-serif}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent3);margin-left:5px;vertical-align:middle;transition:background .3s}
.dot.dirty{background:var(--accent2)}
.nav-section{padding:12px 16px 5px;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-left:3px solid transparent;color:var(--muted);font-weight:500;transition:all .15s;font-size:13px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{border-left-color:var(--accent);background:var(--surface2);color:var(--accent)}
.nav-item .ico{font-size:15px;min-width:18px;text-align:center}
.nav-bottom{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}

/* MAIN */
#app{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 28px;background:var(--surface);border-bottom:1px solid var(--border);min-height:52px}
.topbar h2{font-family:'Bebas Neue',cursive;font-size:19px;letter-spacing:2px;color:var(--text);flex:1}
#page{flex:1;overflow-y:auto;padding:24px 28px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--radius);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-accent{background:var(--accent);color:#000;font-weight:700}.btn-accent:hover{background:#ffd740}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2)}.btn-ghost:hover{color:var(--text);border-color:#555}
.btn-danger{background:transparent;color:var(--accent2);border:1px solid var(--accent2)}.btn-danger:hover{background:var(--accent2);color:#fff}
.btn-green{background:var(--accent3);color:#000;font-weight:700}.btn-green:hover{filter:brightness(1.1)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-w{width:100%}

/* INPUTS */
input,textarea,select{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:13px;padding:8px 11px;outline:none;transition:border .15s;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:60px}
.field{display:flex;flex-direction:column;gap:4px;flex:1}
.field label{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.row{display:flex;gap:12px;margin-bottom:14px;align-items:flex-end}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radiusLg);padding:18px 20px;margin-bottom:18px}
.card-title{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radiusLg);padding:16px 18px}
.stat-box .val{font-family:'Bebas Neue',cursive;font-size:30px;color:var(--accent);line-height:1;margin-bottom:3px}
.stat-box .lbl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.stat-box .sub{font-size:11px;color:var(--muted2);margin-top:3px}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{background:#111;color:var(--muted);text-align:left;padding:9px 12px;font-size:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle}
table.tbl tr:hover td{background:var(--surface2)}
table.tbl .actions{display:flex;gap:6px;justify-content:flex-end}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.5px}
.badge-green{background:rgba(76,175,80,.15);color:var(--accent3);border:1px solid rgba(76,175,80,.3)}
.badge-red{background:rgba(224,92,42,.15);color:var(--accent2);border:1px solid rgba(224,92,42,.3)}
.badge-yellow{background:rgba(245,197,24,.15);color:var(--accent);border:1px solid rgba(245,197,24,.3)}
.badge-blue{background:rgba(74,158,255,.15);color:var(--accentBlue);border:1px solid rgba(74,158,255,.3)}

/* AVATAR */
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface3);border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',cursive;font-size:15px;color:var(--accent);flex-shrink:0}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:10px;margin:20px 0 12px}
.divider span{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:500}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radiusLg);padding:26px;width:540px;max-width:96vw;max-height:88vh;overflow-y:auto}
.modal-lg{width:720px}
.modal h3{font-family:'Bebas Neue',cursive;font-size:21px;color:var(--accent);letter-spacing:1px;margin-bottom:14px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:8px;font-size:13px;z-index:600;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{border-color:var(--accent3);color:var(--accent3)}
.toast.warn{border-color:var(--accent2);color:var(--accent2)}

/* EXERCISE */
.ex-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.ex-head{display:flex;align-items:center;gap:10px;background:#111;padding:9px 14px;cursor:pointer;user-select:none}
.ex-num{font-family:'Bebas Neue',cursive;font-size:18px;color:var(--accent);min-width:20px}
.ex-name{flex:1;font-weight:500;font-size:13px}
.ex-name.empty{color:var(--muted);font-style:italic;font-weight:400}
.tipo-pill{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.chevron{color:var(--muted);font-size:11px;transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.ex-body{padding:14px;display:flex;flex-direction:column;gap:12px}

/* GRID SETTIMANE */
.grid-wrap{overflow-x:auto}
table.wgrid{border-collapse:collapse;width:100%;min-width:620px;font-size:11px}
table.wgrid th{background:#0d0d0d;color:var(--muted);text-align:center;padding:5px 3px;font-size:9px;letter-spacing:.5px;border:1px solid var(--border);white-space:nowrap}
table.wgrid th.ac{color:var(--accent)}
table.wgrid td{border:1px solid var(--border);padding:2px}
table.wgrid td input{background:transparent;border:none;text-align:center;padding:4px 2px;font-size:11px;color:var(--text);min-width:60px;width:100%;outline:none}
table.wgrid td input:focus{background:rgba(245,197,24,.06);border-radius:3px}
table.wgrid tr:nth-child(even) td{background:rgba(255,255,255,.02)}
table.wgrid .kgl{color:var(--muted);font-size:10px;text-align:left;padding:4px 6px;background:#0d0d0d;white-space:nowrap}

/* MACRO */
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.macro-box{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.macro-box .mv{font-family:'Bebas Neue',cursive;font-size:24px;line-height:1}
.macro-box .ml{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:3px}

/* EMPTY */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ico{font-size:40px;margin-bottom:12px}

/* CLIENT SELECTOR */
.client-selector{display:flex;align-items:center;gap:8px}
.client-selector select{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius);padding:6px 10px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;min-width:200px;cursor:pointer}
.client-selector select:focus{border-color:var(--accent)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media (max-width:900px){
  nav{width:200px;min-width:200px}
  #page{padding:16px 18px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .row3{grid-template-columns:1fr 1fr}
  .row4{grid-template-columns:1fr 1fr}
  .macro-grid{grid-template-columns:repeat(2,1fr)}
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 16px}
  .modal,.modal-lg{width:95vw}
}
@media (max-width:680px){
  body{overflow:auto;height:auto}
  .app{flex-direction:column;height:auto;min-height:100vh}
  nav{width:100%;min-width:100%;height:auto;overflow:visible;flex-direction:row;flex-wrap:wrap}
  .nav-logo{padding:10px 14px;border-bottom:none;border-right:1px solid var(--border)}
  .nav-logo small{display:none}
  .nav-section{display:none}
  .nav-item{padding:8px 10px;border-left:none;border-bottom:3px solid transparent;flex-direction:column;gap:2px;font-size:10px}
  .nav-item .icon{font-size:18px}
  .nav-item.active{border-left-color:transparent;border-bottom-color:var(--accent)}
  .nav-bottom{display:none}
  #app{overflow:visible}
  #page{overflow:visible;padding:14px}
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px}
  .row3{grid-template-columns:1fr}
  .row4{grid-template-columns:1fr 1fr}
  .modal{padding:16px}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <div class="nav-logo-inner">
      <svg width="38" height="38" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,7 84,26 84,74 50,93 16,74 16,26" fill="#111" stroke="#f5c518" stroke-width="3.5"/>
        <rect x="23" y="46" width="54" height="8" rx="3" fill="#f5c518"/>
        <rect x="15" y="34" width="9" height="32" rx="2.5" fill="#f5c518"/>
        <rect x="76" y="34" width="9" height="32" rx="2.5" fill="#f5c518"/>
        <rect x="24" y="39" width="6" height="22" rx="2" fill="#f5c518"/>
        <rect x="70" y="39" width="6" height="22" rx="2" fill="#f5c518"/>
        <rect x="30" y="43" width="4" height="14" rx="1.5" fill="#d4a500"/>
        <rect x="66" y="43" width="4" height="14" rx="1.5" fill="#d4a500"/>

        <rect x="50" y="46" width="3" height="8" rx="1" fill="#b8900a" opacity=".8"/>

  <div class="nav-item" data-page="clienti" onclick="go('clienti',this)"><span class="ico">👤</span>Anagrafica</div>

  <div class="nav-item" data-page="schede" onclick="go('schede',this)"><span class="ico">📋</span>Schede</div>
  <div class="nav-item" data-page="progressi" onclick="go('progressi',this)"><span class="ico">📊</span>Progressi & Misure</div>

  <div class="topbar">
    <h2 id="pageTitle">DASHBOARD</h2>
    <div class="client-selector">
      <span style="color:var(--muted);font-size:12px">Cliente:</span>
      <select id="clientSelect" onchange="onClientChange()">
        <option value="">— Seleziona cliente —</option>

    <div id="mContent"></div>
    <div class="modal-btns" id="mBtns"></div>
  </div>
</div>
<div class="toast" id="toast"></div>


<script>

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAb6xP3pt3_CjdDxWhXsAIbhzz1va_-aN4",
  authDomain: "iamspino-coaching.firebaseapp.com",
  projectId: "iamspino-coaching",
  storageBucket: "iamspino-coaching.firebasestorage.app",
  messagingSenderId: "209519262391",
  appId: "1:209519262391:web:dcdec856fa022d7e60eb32"
};

const DB = (() => {
  const KEY = "iamspino_v1";
  let _d = null;
  let _firestore = null;
  let _synced = false;

  function defaults() { return { clienti: [], pagamenti: [] }; }

  function loadLocal() {
    try {
      const raw = localStorage.getItem(KEY);
      _d = raw ? JSON.parse(raw) : defaults();
      if (!Array.isArray(_d.clienti))   _d.clienti   = [];
      if (!Array.isArray(_d.pagamenti)) _d.pagamenti = [];
    } catch(e) { _d = defaults(); }
  }

  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(_d)); } catch(e) {}
    const dot = document.getElementById("dot");
    if (dot) dot.classList.remove("dirty");
  }

  function showSync(ok) {
    const dot = document.getElementById("dot");
    if (!dot) return;
    dot.style.background = ok ? "#4caf50" : "#f5c518";
    dot.title = ok ? "Sincronizzato con Firebase ☁️" : "Solo locale";
  }

  function initFirebase() {
    try {
      if (typeof firebase === "undefined") { showSync(false); return; }
      firebase.initializeApp(FIREBASE_CONFIG);
      _firestore = firebase.firestore();
      _synced = true;
      showSync(true);

      // Migrazione: se Firebase è vuoto ma localStorage ha dati, carica su Firebase
      _firestore.collection("clienti").get().then(snap0 => {
        if (snap0.empty && _d.clienti.length > 0) {
          console.log("Migrazione dati locali su Firebase...");
          const batch = _firestore.batch();
          _d.clienti.forEach(cl => {
            const clean = JSON.parse(JSON.stringify(cl));
            batch.set(_firestore.collection("clienti").doc(cl.id), clean);
          });
          _d.pagamenti.forEach(p => {
            const clean = JSON.parse(JSON.stringify(p));
            batch.set(_firestore.collection("pagamenti").doc(p.id), clean);
          });
          batch.commit().then(() => console.log("Migrazione completata ✓"));
        }
      });

      // Real-time listener clienti
      _firestore.collection("clienti").onSnapshot(snap => {
        _d.clienti = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        saveLocal();
        if (typeof refreshClientSelector === "function") refreshClientSelector();
        if (typeof renderPage === "function") renderPage();
      });

      // Real-time listener pagamenti
      _firestore.collection("pagamenti").onSnapshot(snap => {
        _d.pagamenti = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        saveLocal();
      });

    } catch(e) {
      console.warn("Firebase init failed:", e);
      showSync(false);
    }
  }

  function push(col, id, data) {
    if (!_synced || !_firestore) return;
    // Clean undefined values for Firestore
    const clean = JSON.parse(JSON.stringify(data));
    _firestore.collection(col).doc(id).set(clean).catch(e => console.warn("Push error:", e));
  }

  function remove(col, id) {
    if (!_synced || !_firestore) return;
    _firestore.collection(col).doc(id).delete().catch(e => console.warn("Delete error:", e));
  }

  function save() { saveLocal(); }

  let _t = null;
  function delaySave() {
    const dot = document.getElementById("dot");
    if (dot) dot.classList.add("dirty");
    clearTimeout(_t);
    _t = setTimeout(save, 700);
  }

  function get() { if (!_d) loadLocal(); return _d; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function getClients()  { return get().clienti; }
  function getClient(id) { return get().clienti.find(c => c.id === id) || null; }

  function addClient(fields) {
    const c = { id: uid(), createdAt: Date.now(), schede:[], misure:[],
      nome:"", cognome:"", sesso:"", dataNascita:"", telefono:"", email:"",
      obiettivo:"", livello:"", stato:"attivo", tipoAbb:"", inizioAbb:"",
      scadenzaAbb:"", altezza:"", anamnesi:"", ...fields };
    get().clienti.push(c);
    save(); push("clienti", c.id, c); return c;
  }

  function updateClient(id, fields) {
    const c = getClient(id); if (!c) return;
    Object.assign(c, fields);
    save(); push("clienti", id, c);
  }

  function deleteClient(id) {
    get().clienti   = get().clienti.filter(c => c.id !== id);
    get().pagamenti = get().pagamenti.filter(p => p.clienteId !== id);
    save(); remove("clienti", id);
  }

  function getSchede(cid) { return getClient(cid)?.schede || []; }

  function addScheda(cid, fields) {
    const c = getClient(cid); if (!c) return null;
    if (!Array.isArray(c.schede)) c.schede = [];
    const s = { id: uid(), createdAt: Date.now(), label:"A", riscaldamento:"", note:"", esercizi:[], ...fields };
    c.schede.push(s); save(); push("clienti", cid, c); return s;
  }

  function updateScheda(cid, sid, fields) {
    const c = getClient(cid); if (!c) return;
    const s = (c.schede||[]).find(s => s.id === sid); if (!s) return;
    Object.assign(s, fields); save(); push("clienti", cid, c);
  }

  function deleteScheda(cid, sid) {
    const c = getClient(cid); if (!c) return;
    c.schede = (c.schede||[]).filter(s => s.id !== sid);
    save(); push("clienti", cid, c);
  }

  function getMisure(cid) { return getClient(cid)?.misure || []; }

  function addMisura(cid, fields) {
    const c = getClient(cid); if (!c) return;
    if (!Array.isArray(c.misure)) c.misure = [];
    c.misure.push({ id: uid(), data: today(), ...fields });
    c.misure.sort((a,b) => (a.data||"").localeCompare(b.data||""));
    save(); push("clienti", cid, c);
  }

  function deleteMisura(cid, mid) {
    const c = getClient(cid); if (!c) return;
    c.misure = (c.misure||[]).filter(m => m.id !== mid);
    save(); push("clienti", cid, c);
  }

  function getNutrizione(cid)    { return getClient(cid)?.nutrizione || null; }
  function setNutrizione(cid, n) {
    const c = getClient(cid); if (!c) return;
    c.nutrizione = n; save(); push("clienti", cid, c);
  }

  function getPagamentiCliente(cid) { return (get().pagamenti||[]).filter(p => p.clienteId === cid); }
  function getAllPagamenti()         { return get().pagamenti || []; }

  function addPagamento(fields) {
    const rec = { id: uid(), data: today(), ...fields };
    get().pagamenti.push(rec);
    save(); push("pagamenti", rec.id, rec); return rec;
  }

  function deletePagamento(id) {
    get().pagamenti = get().pagamenti.filter(p => p.id !== id);
    save(); remove("pagamenti", id);
  }

  function today() { return new Date().toISOString().slice(0,10); }
  function esc(s)  { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function fmt(d)  { if (!d) return "—"; try { const [y,m,g]=d.split("-"); return g+"/"+m+"/"+y; } catch(e){return d;} }
  function fmtEur(n){ return "€ "+(parseFloat(n)||0).toFixed(2); }
  function age(dob){
    if (!dob) return "—";
    try {
      const d=new Date(dob),now=new Date();
      if (isNaN(d.getTime())) return "—";
      let a=now.getFullYear()-d.getFullYear();
      if (now<new Date(now.getFullYear(),d.getMonth(),d.getDate())) a--;
      return a;
    } catch(e){return "—";}
  }

  loadLocal();
  window.addEventListener("load", () => setTimeout(initFirebase, 300));

  return {
    getClients, getClient, addClient, updateClient, deleteClient,
    getSchede, addScheda, updateScheda, deleteScheda,
    getMisure, addMisura, deleteMisura,
    getNutrizione, setNutrizione,
    getPagamentiCliente, getAllPagamenti, addPagamento, deletePagamento,
    save, delaySave, uid, today, esc, fmt, fmtEur, age
  };
})();

function exCard(sid, ex, ei) {
  const key  = sid + ex.id;
  const open = !!_openEx[key];
  return `
  <div class="ex-card" id="excard-${key}">
    <div class="ex-head" onclick="toggleEx('${key}')">
      <span class="ex-num">${ei+1}</span>
      <span class="ex-name ${!ex.nome?'empty':''}">${ex.nome?DB.esc(ex.nome):'Clicca per aprire…'}</span>
      <span class="tipo-pill">${DB.esc(ex.tipo||'Singolo')}</span>
      <span class="chevron ${open?'open':''}">▼</span>
      <span onclick="event.stopPropagation();deleteEsercizio('${sid}','${ex.id}')"
        style="color:var(--muted);cursor:pointer;padding:3px 7px;border-radius:4px;font-size:14px"
        onmouseover="this.style.color='var(--accent2)'" onmouseout="this.style.color='var(--muted)'">🗑</span>
    </div>
    ${open ? exBody(sid, ex) : ''}
  </div>`;
}

function exBody(sid, ex) {
  const kgRows = ex.kgRows && ex.kgRows.length ? ex.kgRows : [Array(7).fill('')];
  const sett   = ex.settimane && ex.settimane.length === 7 ? ex.settimane : Array(7).fill('');
  return `
  <div class="ex-body">
    <div class="row">
      <div class="field"><label>Nome Esercizio</label>
        <input value="${DB.esc(ex.nome||'')}" placeholder="es. PREACHER CURL AI CAVI"
          onchange="updateExField('${sid}','${ex.id}','nome',this.value)"></div>

        <select onchange="updateExField('${sid}','${ex.id}','tipo',this.value)">

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function toggleEx(key) { _openEx[key] = !_openEx[key]; renderPage(); }

function newEx() {
  return { id: DB.uid(), tipo:'Singolo', nome:'', note:'', video:'',
           tut:'', rip:'', prep:'', settimane:Array(7).fill(''), kgRows:[Array(7).fill('')] };
}

function getMutScheda(sid) {
  const c = DB.getClient(currentClientId); if (!c) return null;
  return (c.schede||[]).find(s => s.id === sid) || null;
}

function addEsercizio(sid) {
  const s = getMutScheda(sid); if (!s) return;
  if (!s.esercizi) s.esercizi = [];
  const ex = newEx();
  s.esercizi.push(ex);
  _openEx[sid+ex.id] = true;
  DB.save(); renderPage();
}

function deleteEsercizio(sid, exId) {
  const s = getMutScheda(sid); if (!s) return;
  s.esercizi = (s.esercizi||[]).filter(e => e.id !== exId);
  DB.save(); renderPage();
}

function updateExField(sid, exId, field, val) {
  const s = getMutScheda(sid); if (!s) return;
  const ex = (s.esercizi||[]).find(e => e.id === exId); if (!ex) return;
  ex[field] = val;
  if (field === 'nome' || field === 'tipo') { DB.save(); renderPage(); } else DB.save();
}

function updateExSett(sid, exId, idx, val) {
  const s = getMutScheda(sid); if (!s) return;
  const ex = (s.esercizi||[]).find(e => e.id === exId); if (!ex) return;
  if (!ex.settimane || ex.settimane.length !== 7) ex.settimane = Array(7).fill('');
  ex.settimane[idx] = val; DB.save();
}

function updateKgCell(sid, exId, ri, ci, val) {
  const s = getMutScheda(sid); if (!s) return;
  const ex = (s.esercizi||[]).find(e => e.id === exId); if (!ex) return;
  if (!ex.kgRows || !ex.kgRows[ri]) return;
  ex.kgRows[ri][ci] = val; DB.save();
}

function addKgRow(sid, exId) {
  const s = getMutScheda(sid); if (!s) return;
  const ex = (s.esercizi||[]).find(e => e.id === exId); if (!ex) return;
  if (!ex.kgRows) ex.kgRows = [];
  ex.kgRows.push(Array(7).fill(''));
  DB.save(); renderPage();
}

function removeKgRow(sid, exId, ri) {
  const s = getMutScheda(sid); if (!s) return;
  const ex = (s.esercizi||[]).find(e => e.id === exId); if (!ex) return;
  if (!ex.kgRows || ex.kgRows.length <= 1) return;
  ex.kgRows.splice(ri, 1);
  DB.save(); renderPage();
}

// ── PROGRESSI ─────────────────────────────────────────────────────────────────
function renderProgressi() {
  if (!currentClientId) return noClient();
  const c = DB.getClient(currentClientId); if (!c) return noClient();
  const misure = DB.getMisure(currentClientId);
  const last   = misure[misure.length-1] || null;
  const first  = misure[0] || null;
  function delta(field) {
    if (!first || !last || first.id === last.id) return '';
    const d = (parseFloat(last[field])||0) - (parseFloat(first[field])||0);
    if (!d) return '';
    const col = d < 0 ? 'var(--accent3)' : 'var(--accent2)';
    return '<span style="font-size:12px;color:'+col+';margin-left:5px">'+(d>0?'+':'')+d.toFixed(1)+'</span>';
  }
  return `
  <div style="display:flex;gap:10px;margin-bottom:18px">
    <button class="btn btn-accent" onclick="openAddMisuraModal()">+ Nuova Misurazione</button>
  </div>
  ${last ? `<div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat-box"><div class="val" style="font-size:22px">${last.peso||'—'} kg${delta('peso')}</div><div class="lbl">Peso</div></div>
    <div class="stat-box"><div class="val" style="font-size:22px">${last.grassoPerc||'—'}%${delta('grassoPerc')}</div><div class="lbl">% Grasso</div></div>
    <div class="stat-box"><div class="val" style="font-size:22px">${last.bmi||'—'}</div><div class="lbl">BMI</div></div>
    <div class="stat-box"><div class="val" style="font-size:22px">${last.vita||'—'} cm${delta('vita')}</div><div class="lbl">Vita</div></div>
  </div>` : ''}
  ${misure.length >= 2 ? `
  <div class="card"><div class="card-title"><span>Andamento Peso (kg)</span></div>${svgLine(misure,'peso','var(--accent)')}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
    <div class="card"><div class="card-title"><span>% Massa Grassa</span></div>${svgLine(misure,'grassoPerc','#4a9eff')}</div>
    <div class="card"><div class="card-title"><span>Vita (cm)</span></div>${svgLine(misure,'vita','var(--accent2)')}</div>
  </div>` : ''}
  <div class="card">
    <div class="card-title"><span>Storico Misurazioni</span></div>
    ${misure.length === 0
      ? `<div class="empty"><div class="ico">📏</div><p>Nessuna misurazione ancora.</p></div>`
      : `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Data</th><th>Peso</th><th>% Grasso</th><th>BMI</th><th>Vita</th><th>Fianchi</th><th>Braccio</th><th>Coscia</th><th>Note</th><th></th></tr></thead>
        <tbody>${[...misure].reverse().map(m=>`<tr>
          <td style="font-weight:500">${DB.fmt(m.data)}</td>
          <td>${m.peso||'—'} kg</td><td>${m.grassoPerc||'—'}%</td><td>${m.bmi||'—'}</td>
          <td>${m.vita||'—'} cm</td><td>${m.fianchi||'—'} cm</td>
          <td>${m.braccio||'—'} cm</td><td>${m.coscia||'—'} cm</td>
          <td style="font-size:11px;color:var(--muted2)">${DB.esc(m.note||'')}</td>
          <td><div class="actions"><button class="btn btn-danger btn-sm" onclick="confirmDeleteMisura('${m.id}')">🗑</button></div></td>
        </tr>`).join('')}</tbody></table></div>`}
  </div>`;
}

function svgLine(misure, field, color) {
  const pts = misure.map(m=>({d:m.data,v:parseFloat(m[field])||0})).filter(p=>p.v>0);
  if (pts.length < 2) return '<p style="color:var(--muted);font-size:12px;text-align:center;padding:16px">Dati insufficienti</p>';
  const W=680,H=130,P=28;
  const vals=pts.map(p=>p.v);
  let mn=Math.min(...vals)*0.97, mx=Math.max(...vals)*1.03;
  if(mn===mx){mn-=1;mx+=1;}
  const x=i=>P+(i/(pts.length-1))*(W-P*2);
  const y=val=>P+(1-(val-mn)/(mx-mn))*(H-P*2);
  const poly=pts.map((p,i)=>x(i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ');
  const area='M'+x(0).toFixed(1)+','+(H-P)+' '+pts.map((p,i)=>'L'+x(i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ')+' L'+x(pts.length-1).toFixed(1)+','+(H-P)+' Z';
  return '<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;display:block">'
    +'<defs><linearGradient id="g_'+field+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".25"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#g_'+field+')" />'
    +'<polyline points="'+poly+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>'
    +pts.map((p,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="4" fill="'+color+'"/>'
      +'<text x="'+x(i).toFixed(1)+'" y="'+(y(p.v)-9).toFixed(1)+'" text-anchor="middle" style="fill:#ccc;font-size:9px;font-family:sans-serif">'+p.v+'</text>'
      +'<text x="'+x(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" style="fill:#555;font-size:9px;font-family:sans-serif">'+(p.d||'').slice(5)+'</text>'
    ).join('')
    +'</svg></div>';
}

    { label:'Elimina', cls:'btn-danger', fn:()=>{ DB.deleteMisura(currentClientId,mid); closeModal(); renderPage(); toast('Eliminata','warn'); }}
  ]);
}

// ── NUTRIZIONE ────────────────────────────────────────────────────────────────
function renderNutrizione() {
  if (!currentClientId) return noClient();
  const c = DB.getClient(currentClientId); if (!c) return noClient();
  const n = DB.getNutrizione(currentClientId);
  if (!n) return `
  <div class="empty" style="padding:80px 20px">
    <div class="ico">🍽</div>
    <p style="margin-bottom:18px">Nessun piano nutrizionale per ${DB.esc(c.nome)}.</p>
    <button class="btn btn-accent" onclick="openNutrizioneModal()">+ Crea Piano Nutrizionale</button>
  </div>`;
  const pasti=n.pasti||[];
  const totKcal=pasti.reduce((s,p)=>s+(parseFloat(p.kcal)||0),0);
  const totProt=pasti.reduce((s,p)=>s+(parseFloat(p.prot)||0),0);
  const totCarb=pasti.reduce((s,p)=>s+(parseFloat(p.carb)||0),0);
  const totGras=pasti.reduce((s,p)=>s+(parseFloat(p.gras)||0),0);
  return `
  <div style="display:flex;gap:10px;margin-bottom:18px">
    <button class="btn btn-accent" onclick="openNutrizioneModal()">✏️ Modifica Piano</button>
    <button class="btn btn-ghost" onclick="printNutrizione()">🖨 Stampa</button>
  </div>
  <div class="macro-grid">
    <div class="macro-box"><div class="mv" style="color:var(--accent)">${totKcal}</div><div class="ml">kcal/giorno</div></div>
    <div class="macro-box"><div class="mv" style="color:#4a9eff">${totProt}g</div><div class="ml">Proteine</div></div>
    <div class="macro-box"><div class="mv" style="color:#a78bfa">${totCarb}g</div><div class="ml">Carboidrati</div></div>
    <div class="macro-box"><div class="mv" style="color:var(--accent2)">${totGras}g</div><div class="ml">Grassi</div></div>
  </div>
  ${n.obiettivo||n.note?`<div class="card" style="margin-bottom:14px">
    ${n.obiettivo?`<div style="margin-bottom:8px"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Obiettivo</div><div style="font-weight:500;margin-top:2px">${DB.esc(n.obiettivo)}</div></div>`:''}
    ${n.note?`<div><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Note</div><div style="font-size:13px;color:var(--muted2);margin-top:2px;white-space:pre-wrap">${DB.esc(n.note)}</div></div>`:''}
  </div>`:''}
  ${pasti.map((p,i)=>`<div class="card" style="margin-bottom:12px">
    <div class="card-title"><span>🍴 ${DB.esc(p.nome||('Pasto '+(i+1)))}</span><span style="color:var(--muted2);font-size:12px">${p.ora||''}</span></div>
    <div class="macro-grid" style="margin-bottom:${p.alimenti?'12px':'0'}">
      <div class="macro-box"><div class="mv" style="color:var(--accent)">${p.kcal||'—'}</div><div class="ml">kcal</div></div>
      <div class="macro-box"><div class="mv" style="color:#4a9eff">${p.prot||'—'}g</div><div class="ml">Prot</div></div>
      <div class="macro-box"><div class="mv" style="color:#a78bfa">${p.carb||'—'}g</div><div class="ml">Carb</div></div>
      <div class="macro-box"><div class="mv" style="color:var(--accent2)">${p.gras||'—'}g</div><div class="ml">Gras</div></div>
    </div>
    ${p.alimenti?`<div style="font-size:13px;color:var(--muted2);white-space:pre-wrap;border-left:2px solid var(--border2);padding-left:10px">${DB.esc(p.alimenti)}</div>`:''}
  </div>`).join('')}`;
}

function openNutrizioneModal() {
  if (!currentClientId) return;
  const n = DB.getNutrizione(currentClientId)||{pasti:[{nome:'Colazione',ora:'07:30'},{nome:'Pranzo',ora:'13:00'},{nome:'Cena',ora:'20:00'}]};
  function ph(p,i) {
    return `<div class="card" style="background:var(--surface2);margin-bottom:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <strong>Pasto ${i+1}</strong><button class="btn btn-danger btn-sm" onclick="this.closest('.card').remove()">Rimuovi</button>
      </div>
      <div class="row">
        <div class="field"><label>Nome</label><input class="np-nome" value="${DB.esc(p.nome||'')}"></div>
        <div class="field" style="max-width:100px"><label>Orario</label><input class="np-ora" value="${DB.esc(p.ora||'')}"></div>
      </div>
      <div class="row4">
        <div class="field"><label>Kcal</label><input type="number" class="np-kcal" value="${p.kcal||''}"></div>
        <div class="field"><label>Prot (g)</label><input type="number" class="np-prot" value="${p.prot||''}"></div>
        <div class="field"><label>Carb (g)</label><input type="number" class="np-carb" value="${p.carb||''}"></div>
        <div class="field"><label>Gras (g)</label><input type="number" class="np-gras" value="${p.gras||''}"></div>
      </div>
      <div class="field"><label>Alimenti</label><textarea class="np-ali" rows="2">${DB.esc(p.alimenti||'')}</textarea></div>
    </div>`;
  }
  modal('Piano Nutrizionale',`
  <div class="row"><div class="field"><label>Obiettivo Calorico</label><input id="n-obiettivo" value="${DB.esc(n.obiettivo||'')}"></div></div>
  <div class="field" style="margin-bottom:14px"><label>Note Generali</label><textarea id="n-note" rows="2">${DB.esc(n.note||'')}</textarea></div>
  <div id="npasti">${(n.pasti||[]).map((p,i)=>ph(p,i)).join('')}</div>
  <button class="btn btn-ghost btn-sm" style="margin-bottom:8px" onclick="addNPasto()">+ Aggiungi Pasto</button>`,[
    {label:'Annulla',cls:'btn-ghost',fn:closeModal},
    {label:'Salva Piano',cls:'btn-accent',fn:saveNutrizione}
  ],true);
}

function addNPasto() {
  const cont=document.getElementById('npasti'); if(!cont) return;
  const i=cont.querySelectorAll('.card').length;
  const div=document.createElement('div');
  div.innerHTML=`<div class="card" style="background:var(--surface2);margin-bottom:10px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <strong>Pasto ${i+1}</strong><button class="btn btn-danger btn-sm" onclick="this.closest('.card').remove()">Rimuovi</button>
    </div>
    <div class="row">
      <div class="field"><label>Nome</label><input class="np-nome" placeholder="Spuntino"></div>
      <div class="field" style="max-width:100px"><label>Orario</label><input class="np-ora" placeholder="10:30"></div>
    </div>
    <div class="row4">
      <div class="field"><label>Kcal</label><input type="number" class="np-kcal"></div>
      <div class="field"><label>Prot (g)</label><input type="number" class="np-prot"></div>
      <div class="field"><label>Carb (g)</label><input type="number" class="np-carb"></div>
      <div class="field"><label>Gras (g)</label><input type="number" class="np-gras"></div>
    </div>
    <div class="field"><label>Alimenti</label><textarea class="np-ali" rows="2"></textarea></div>
  </div>`;
  cont.appendChild(div.firstElementChild);
}

function saveNutrizione() {
  const cards=document.querySelectorAll('#npasti .card');
  const pasti=Array.from(cards).map(card=>({
    nome:card.querySelector('.np-nome')?.value||'',ora:card.querySelector('.np-ora')?.value||'',
    kcal:card.querySelector('.np-kcal')?.value||'',prot:card.querySelector('.np-prot')?.value||'',
    carb:card.querySelector('.np-carb')?.value||'',gras:card.querySelector('.np-gras')?.value||'',
    alimenti:card.querySelector('.np-ali')?.value||'',
  }));
  DB.setNutrizione(currentClientId,{obiettivo:v('n-obiettivo'),note:v('n-note'),pasti});
  closeModal(); renderPage(); toast('Piano salvato ✓','ok');
}

function printNutrizione() {
  const n=DB.getNutrizione(currentClientId); if(!n) return;
  const c=DB.getClient(currentClientId); if(!c) return;
  const pasti=n.pasti||[]; const e=DB.esc;
  const tot=f=>pasti.reduce((s,p)=>s+(parseFloat(p[f])||0),0);
  let h=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Nutrizione</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;font-size:10pt;color:#111}
  .pg{width:210mm;margin:0 auto;padding:11mm}.bar{background:#111;color:#f5c518;font-size:16pt;text-align:center;padding:6px;letter-spacing:2px;margin-bottom:8px}
  .macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.mb{border:1px solid #ccc;border-radius:4px;padding:7px;text-align:center}
  .mv{font-size:16pt;font-weight:600}.ml{font-size:8pt;color:#666}
  .pasto{border:1px solid #ccc;border-radius:3px;margin-bottom:7px;overflow:hidden}
  .ph{background:#222;color:#fff;padding:5px 10px;display:flex;justify-content:space-between}
  .pm{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 10px}
  .pmb{background:#f5f5f5;border-radius:3px;padding:4px;text-align:center;font-size:8pt}
  .ali{font-size:8.5pt;color:#444;white-space:pre-wrap;border-left:2px solid #f5c518;padding:4px 10px;background:#fffdf0}
  @media print{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style>
  </head><body><div class="pg">
  <div class="bar">Piano Nutrizionale — ${e(c.nome)} ${e(c.cognome||'')}</div>
  <div class="macros"><div class="mb"><div class="mv">${tot('kcal')}</div><div class="ml">kcal/gg</div></div>
  <div class="mb"><div class="mv">${tot('prot')}g</div><div class="ml">Prot</div></div>
  <div class="mb"><div class="mv">${tot('carb')}g</div><div class="ml">Carb</div></div>
  <div class="mb"><div class="mv">${tot('gras')}g</div><div class="ml">Gras</div></div></div>`;
  pasti.forEach(p=>{
    h+=`<div class="pasto"><div class="ph"><strong>${e(p.nome||'Pasto')}</strong><span style="opacity:.7">${p.ora||''}</span></div>
    <div class="pm"><div class="pmb"><strong>${p.kcal||0}</strong><br>kcal</div><div class="pmb"><strong>${p.prot||0}g</strong><br>Prot</div>
    <div class="pmb"><strong>${p.carb||0}g</strong><br>Carb</div><div class="pmb"><strong>${p.gras||0}g</strong><br>Gras</div></div>
    ${p.alimenti?`<div class="ali">${e(p.alimenti)}</div>`:''}</div>`;
  });
  h+=`</div></body></html>`;
  const w=window.open('','_blank'); w.document.write(h); w.document.close(); setTimeout(()=>w.print(),600);
}

// ── PAGAMENTI ─────────────────────────────────────────────────────────────────
function renderPagamenti() {
  if (!currentClientId) return noClient();
  const c = DB.getClient(currentClientId); if (!c) return noClient();
  const pags   = DB.getPagamentiCliente(currentClientId);
  const sorted = [...pags].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const now    = new Date();
  const thisM  = now.toISOString().slice(0,7);
  const totale = pags.reduce((s,p)=>s+(parseFloat(p.importo)||0),0);
  const meseC  = pags.filter(p=>(p.data||'').startsWith(thisM)).reduce((s,p)=>s+(parseFloat(p.importo)||0),0);

  let avviso = '';
  if (c.scadenzaAbb) {
    try {
      const diff = Math.ceil((new Date(c.scadenzaAbb)-now)/86400000);
      if (!isNaN(diff)) {
        if (diff < 0) avviso = `<div style="background:rgba(224,92,42,.1);border:1px solid var(--accent2);border-radius:8px;padding:12px 16px;margin-bottom:14px;color:var(--accent2)">⚠️ Abbonamento <strong>scaduto</strong> il ${DB.fmt(c.scadenzaAbb)}</div>`;
        else if (diff<=14) avviso = `<div style="background:rgba(245,197,24,.08);border:1px solid var(--accent);border-radius:8px;padding:12px 16px;margin-bottom:14px;color:var(--accent)">⏰ Scadenza tra <strong>${diff} giorni</strong> (${DB.fmt(c.scadenzaAbb)})</div>`;
      }
    } catch {}
  }

  return `
  ${avviso}
  <div style="display:flex;gap:10px;margin-bottom:18px">
    <button class="btn btn-accent" onclick="openAddPagamentoModal()">+ Registra Pagamento</button>
  </div>
  <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px">
    <div class="stat-box"><div class="val">${DB.fmtEur(totale)}</div><div class="lbl">Totale Incassato</div><div class="sub">${pags.length} pagamenti</div></div>
    <div class="stat-box"><div class="val" style="color:var(--accentBlue)">${DB.fmtEur(meseC)}</div><div class="lbl">Mese Corrente</div><div class="sub">${thisM.replace('-','/')}</div></div>
    <div class="stat-box"><div class="val" style="font-size:18px">${DB.esc(c.tipoAbb||'—')}</div><div class="lbl">Tipo Abbonamento</div><div class="sub">Scadenza: ${DB.fmt(c.scadenzaAbb)}</div></div>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    ${sorted.length===0
      ? `<div class="empty"><div class="ico">💰</div><p>Nessun pagamento registrato.</p></div>`
      : `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Data</th><th>Importo</th><th>Tipo</th><th>Metodo</th><th>Periodo</th><th>Note</th><th></th></tr></thead>
        <tbody>${sorted.map(p=>`<tr>
          <td style="font-weight:500">${DB.fmt(p.data)}</td>
          <td><span style="color:var(--accent3);font-weight:600">${DB.fmtEur(p.importo)}</span></td>
          <td><span class="badge badge-blue">${DB.esc(p.tipo||'—')}</span></td>
          <td style="color:var(--muted2)">${DB.esc(p.metodo||'—')}</td>
          <td style="color:var(--muted2)">${DB.esc(p.periodo||'—')}</td>
          <td style="font-size:11px;color:var(--muted2)">${DB.esc(p.note||'')}</td>
          <td><div class="actions"><button class="btn btn-danger btn-sm" onclick="confirmDeletePagamento('${p.id}')">🗑</button></div></td>
        </tr>`).join('')}</tbody>
      </table></div>`}
  </div>`;
}

function openAddPagamentoModal() {
  if (!currentClientId) return;
  const c = DB.getClient(currentClientId); if (!c) return;
  modal('Registra Pagamento — '+DB.esc(c.nome), `
  <div class="row3">
    <div class="field"><label>Data *</label><input type="date" id="p-data" value="${DB.today()}"></div>
    <div class="field"><label>Importo (€) *</label><input type="number" step="0.01" id="p-importo" placeholder="150.00"></div>
    <div class="field"><label>Tipo</label><select id="p-tipo">
      ${['Mensile','Trimestrale','Semestrale','Annuale','Sessione','Pacchetto','Online','Altro'].map(t=>`<option>${t}</option>`).join('')}
    </select></div>
  </div>
  <div class="row3">
    <div class="field"><label>Metodo</label><select id="p-metodo">
      ${['Contanti','Bonifico','Carta','PayPal','Satispay','Altro'].map(m=>`<option>${m}</option>`).join('')}
    </select></div>
    <div class="field"><label>Periodo Coperto</label><input id="p-periodo" placeholder="es. Marzo 2026"></div>
    <div class="field"><label>Nuova Scadenza Abb.</label><input type="date" id="p-scadenza"></div>
  </div>
  <div class="field"><label>Note</label><textarea id="p-note" rows="2"></textarea></div>`, [
    {label:'Annulla',cls:'btn-ghost',fn:closeModal},
    {label:'Registra',cls:'btn-green',fn:()=>{
      const importo=v('p-importo');
      if(!importo){toast("Inserisci l'importo",'warn');return;}
      DB.addPagamento({clienteId:currentClientId,data:v('p-data')||DB.today(),importo,tipo:v('p-tipo'),metodo:v('p-metodo'),periodo:v('p-periodo'),note:v('p-note')});
      const sc=v('p-scadenza'); if(sc) DB.updateClient(currentClientId,{scadenzaAbb:sc});
      closeModal(); renderPage(); toast('Pagamento registrato ✓','ok');
    }}
  ]);
}

function confirmDeletePagamento(id) {
  modal('Elimina Pagamento','Eliminare questo pagamento?',[
    {label:'Annulla',cls:'btn-ghost',fn:closeModal},
    {label:'Elimina',cls:'btn-danger',fn:()=>{DB.deletePagamento(id);closeModal();renderPage();toast('Eliminato','warn');}}
  ]);
}

// ── APP.JS ────────────────────────────────────────────────────────────────────
let currentPage     = 'dashboard';
let currentClientId = null;

const TITLES = {
  dashboard:'DASHBOARD', clienti:'ANAGRAFICA CLIENTI',
  schede:'SCHEDE ALLENAMENTO', progressi:'PROGRESSI & MISURE',
  nutrizione:'PIANO NUTRIZIONALE', pagamenti:'PAGAMENTI'
};

const PAGES = {
  dashboard: renderDashboard, clienti: renderClienti,
  schede: renderSchede, progressi: renderProgressi,
  nutrizione: renderNutrizione, pagamenti: renderPagamenti
};

// ── SHARED INPUT HELPER ───────────────────────────────────────────────────────
function v(id) { return document.getElementById(id)?.value?.trim() || ''; }

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function go(page, el) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  (el || document.querySelector(`[data-page="${page}"]`))?.classList.add('active');
  document.getElementById('pageTitle').textContent = TITLES[page] || page.toUpperCase();
  renderPage();
}

function goAndSelect(page, id) {
  currentClientId = id;
  document.getElementById('clientSelect').value = id;
  go(page);
}

function renderPage() {
  const fn = PAGES[currentPage];
  document.getElementById('page').innerHTML = fn ? fn() : '';
}

// ── CLIENT SELECTOR ───────────────────────────────────────────────────────────
function refreshClientSelector(selectId) {
  const sel = document.getElementById('clientSelect');
  const keep = selectId || currentClientId;
  sel.innerHTML = '<option value="">— Seleziona cliente —</option>';
  [...DB.getClients()]
    .sort((a,b) => (`${a.nome}${a.cognome||''}`).localeCompare(`${b.nome}${b.cognome||''}`))
    .forEach(c => {
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = `${c.nome} ${c.cognome||''}`.trim();
      if (c.id === keep) o.selected = true;
      sel.appendChild(o);
    });
  if (keep && DB.getClient(keep)) {
    sel.value = keep;
    currentClientId = keep;
  } else if (!DB.getClient(currentClientId)) {
    currentClientId = null;
    sel.value = '';
  }
}

function onClientChange() {
  currentClientId = document.getElementById('clientSelect').value || null;
  renderPage();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function modal(title, content, buttons, large) {
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mContent').innerHTML = content;
  document.getElementById('modalBox').className = large ? 'modal modal-lg' : 'modal';
  const btns = document.getElementById('mBtns');
  btns.innerHTML = '';
  (buttons||[]).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls||'btn-ghost');
    el.textContent = b.label;
    el.onclick = b.fn;
    btns.appendChild(el);
  });
  document.getElementById('overlay').style.display = 'flex';
}
function closeModal() { document.getElementById('overlay').style.display = 'none'; }

// ── TOAST ─────────────────────────────────────────────────────────────────────
let _tt;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type||'');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.className = 'toast', 3000);
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function noClient() {
  return `<div class="empty"><div class="ico">👤</div><p>Seleziona un cliente in alto<br>oppure creane uno nuovo.</p></div>`;
}

function exportClientJSON() {
  if (!currentClientId) { toast('Seleziona un cliente', 'warn'); return; }
  const c = DB.getClient(currentClientId); if (!c) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(c,null,2)], {type:'application/json'}));
  a.download = `${c.nome}_${c.cognome||'export'}.json`;
  a.click();
  toast('Export completato ✓', 'ok');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(function init() {
  refreshClientSelector();
  go('dashboard');
})();

</script>
