<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IamSpino">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f0f">
<title>IamSpino Coaching</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f0f;--surface:#161616;--surface2:#1e1e1e;--surface3:#262626;
  --border:#2a2a2a;--border2:#353535;
  --accent:#f5c518;--accent2:#e05c2a;--green:#4caf50;--blue:#4a9eff;
  --text:#efefef;--muted:#7a7a7a;--muted2:#a0a0a0;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;min-height:100%}
body{padding-bottom:calc(24px + var(--safe-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit}
.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:1.5px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* TOP BAR */
.top{position:sticky;top:0;z-index:20;background:rgba(15,15,15,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-top:var(--safe-top)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.top h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{color:var(--accent);font-size:13px;letter-spacing:3px;margin-left:6px}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;color:var(--muted2)}
.icon-btn:active{background:var(--surface2)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.on{background:var(--green)}

/* LOGIN */
.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px calc(32px + var(--safe-bottom));max-width:420px;margin:0 auto;text-align:center}
.login svg{width:96px;height:96px;margin:0 auto 18px}
.login h2{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:4px;line-height:1}
.login .sub{font-family:'Bebas Neue',sans-serif;color:var(--accent);letter-spacing:6px;font-size:16px;margin-bottom:32px}
.login p{color:var(--muted2);font-size:14px;margin-bottom:18px;line-height:1.5}
.code-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;color:var(--text);font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:8px;text-align:center;padding:14px 10px;outline:none;text-transform:uppercase}
.code-input:focus{border-color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:12px;font-weight:700;font-size:15px}
.btn-accent{background:var(--accent);color:#000}
.btn-accent:active{filter:brightness(.9)}
.btn-accent:disabled{opacity:.5}
.btn-ghost{border:1px solid var(--border2);color:var(--muted2);font-weight:500}
.err{color:var(--accent2);font-size:13px;min-height:20px;margin:10px 0}

/* HOME */
.hello{padding:22px 0 6px}
.hello .hi{color:var(--muted2);font-size:14px}
.hello .name{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:2px;line-height:1.05}
.section-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.scard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;position:relative}
.scard:active{background:var(--surface2)}
.scard .lbl{font-family:'Bebas Neue',sans-serif;font-size:30px;color:#000;background:var(--accent);min-width:58px;height:58px;padding:0 8px;border-radius:12px;display:grid;place-items:center;line-height:1}
.scard .lbl.long{font-size:18px}
.scard .info{flex:1;min-width:0}
.scard .t{font-weight:600;font-size:16px}
.scard .m{color:var(--muted2);font-size:13px;margin-top:3px}
.scard .arrow{color:var(--muted);font-size:20px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:20px}
.tag-new{background:var(--accent2);color:#fff}
.tag-upd{background:rgba(74,158,255,.18);color:var(--blue)}
.empty{text-align:center;color:var(--muted2);padding:56px 20px;line-height:1.6}
.empty .ico{font-size:44px;margin-bottom:12px}

/* DETAIL */
.dhead{padding:18px 0 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dhead .big{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;color:var(--accent)}
.dhead .sm{color:var(--muted2);font-size:13px;text-align:right}
.msg{background:linear-gradient(135deg,rgba(245,197,24,.12),rgba(245,197,24,.04));border:1px solid rgba(245,197,24,.3);border-radius:14px;padding:12px 14px;margin:8px 0 12px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.msg b{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.note{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--muted2);font-size:14px;line-height:1.5;margin:8px 0 12px;white-space:pre-wrap}
.warm{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:8px 0 4px;font-size:14px}
.warm b{color:var(--accent)}

.weeks{position:sticky;top:calc(56px + var(--safe-top));z-index:10;background:var(--bg);padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.weeks .lab{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:24px;background:var(--surface2);border:1px solid var(--border2);font-weight:600;font-size:13px;color:var(--muted2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#000}

.progress{height:4px;background:var(--surface3);border-radius:4px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--green);transition:width .3s}

.ex{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:12px;overflow:hidden;transition:opacity .2s}
.ex.done{opacity:.55}
.ex-h{display:flex;align-items:flex-start;gap:12px;padding:14px 14px 10px}
.ex-n{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--accent);line-height:1;min-width:22px;padding-top:2px}
.ex-t{flex:1;min-width:0}
.ex-t .nm{font-weight:700;font-size:16px;line-height:1.3;text-transform:uppercase;word-wrap:break-word}
.ex-t .tp{display:inline-block;margin-top:5px;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--border2);color:var(--muted2)}
.check{width:36px;height:36px;border-radius:50%;border:2px solid var(--border2);display:grid;place-items:center;flex:none;font-size:16px;color:transparent}
.ex.done .check{background:var(--green);border-color:var(--green);color:#000}
.ex-main{display:flex;gap:10px;padding:0 14px 12px;flex-wrap:wrap}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px;min-width:0;flex:1 1 30%}
.stat .v{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;letter-spacing:1px;word-break:break-word}
.stat .v.y{color:var(--accent)}
.stat .l{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.stat.wide{flex-basis:100%}
.kgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.kgs span{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1;background:var(--surface3);border-radius:6px;padding:4px 8px}
.ex-note{margin:0 14px 12px;font-size:13.5px;color:var(--muted2);line-height:1.5;white-space:pre-wrap;border-left:2px solid var(--border2);padding-left:10px}
.ex-actions{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:10px;background:var(--surface2);border:1px solid var(--border2);font-size:13px;font-weight:600;text-decoration:none;color:var(--text)}
.pill:active{background:var(--surface3)}
.pill.y{color:var(--accent);border-color:rgba(245,197,24,.35)}
.table-wrap{overflow-x:auto;margin:0 14px 14px;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:460px}
th{background:#0c0c0c;color:var(--muted);font-weight:600;font-size:10px;letter-spacing:.5px;padding:7px 4px;border-bottom:1px solid var(--border)}
th.cur{color:var(--accent)}
td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--border);border-left:1px solid var(--border)}
td:first-child{border-left:none;color:var(--muted);text-align:left;padding-left:8px;white-space:nowrap}
td.cur{background:rgba(245,197,24,.08);color:var(--accent);font-weight:700}
tr:last-child td{border-bottom:none}

/* TIMER */
.timer{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);bottom:calc(16px + var(--safe-bottom));width:calc(100% - 32px);max-width:528px;background:var(--surface2);border:1px solid var(--accent);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;z-index:50;transition:transform .3s;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.timer{visibility:hidden}
.timer.show{transform:translateX(-50%) translateY(0);visibility:visible}
.timer .tv{font-family:'Bebas Neue',sans-serif;font-size:44px;line-height:1;color:var(--accent);min-width:96px}
.timer .tl{flex:1;font-size:13px;color:var(--muted2)}
.timer.end{border-color:var(--green)}
.timer.end .tv{color:var(--green)}

.toast{position:fixed;left:50%;top:calc(70px + var(--safe-top));transform:translateX(-50%) translateY(-20px);background:var(--surface2);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--border2);width:100%;max-width:560px;padding:20px 20px calc(20px + var(--safe-bottom))}
.sheet h3{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;margin-bottom:6px}
.sheet p{color:var(--muted2);font-size:14px;line-height:1.5;margin-bottom:12px}
.sheet .btn{margin-top:10px}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
</style>
</head>
<body>
<div id="root"></div>
<div class="timer" id="timer">
  <div class="tv" id="timerVal">0:00</div>
  <div class="tl" id="timerLbl">Recupero</div>
  <button class="pill" onclick="Timer.add(15)">+15s</button>
  <button class="pill" onclick="Timer.stop()">✕</button>
</div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheetBox"></div></div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAb6xP3pt3_CjdDxWhXsAIbhzz1va_-aN4",
  authDomain: "iamspino-coaching.firebaseapp.com",
  projectId: "iamspino-coaching",
  storageBucket: "iamspino-coaching.firebasestorage.app",
  messagingSenderId: "209519262391",
  appId: "1:209519262391:web:dcdec856fa022d7e60eb32"
};
const LS = {
  get(k, d) { try { const v = localStorage.getItem('isc_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('isc_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('isc_' + k); } catch (e) {} }
};
const LOGO = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <polygon points="50,7 84,26 84,74 50,93 16,74 16,26" fill="#111" stroke="#f5c518" stroke-width="3.5"/>
  <rect x="23" y="46" width="54" height="8" rx="3" fill="#f5c518"/>
  <rect x="15" y="34" width="9" height="32" rx="2.5" fill="#f5c518"/><rect x="76" y="34" width="9" height="32" rx="2.5" fill="#f5c518"/>
  <rect x="24" y="39" width="6" height="22" rx="2" fill="#f5c518"/><rect x="70" y="39" width="6" height="22" rx="2" fill="#f5c518"/>
  <rect x="30" y="43" width="4" height="14" rx="1.5" fill="#d4a500"/><rect x="66" y="43" width="4" height="14" rx="1.5" fill="#d4a500"/></svg>`;

const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const has = v => v != null && String(v).trim() !== '';
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('it-IT', { day:'numeric', month:'long' }) : '';
const safeUrl = u => /^https?:\/\//i.test(String(u||'').trim()) ? String(u).trim() : '';

// ── STATO ──
let db = null, unsub = null, online = false;
const state = {
  code: LS.get('code', null),
  data: LS.get('cache', null),     // ultimo documento ricevuto (funziona anche offline)
  view: 'home', schedaId: null,
};

function initFirebase() {
  if (db || typeof firebase === 'undefined') return;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  } catch (e) { console.warn(e); }
}

function listen(code) {
  if (unsub) { unsub(); unsub = null; }
  initFirebase();
  if (!db) return;
  unsub = db.collection('app_clienti').doc(code).onSnapshot(snap => {
    online = !snap.metadata.fromCache;
    if (!snap.exists) {
      if (!snap.metadata.fromCache) { toast('Accesso non più valido: chiedi un nuovo codice al tuo coach'); logout(true); }
      return;
    }
    const prev = state.data;
    state.data = snap.data();
    LS.set('cache', state.data);
    notifyChanges(prev, state.data);
    render();
  }, err => { console.warn(err); online = false; render(); });
}

function notifyChanges(prev, next) {
  if (!prev || !prev.schede) return;
  const fresh = Object.values(next.schede || {}).filter(s => !prev.schede[s.id] || prev.schede[s.id].inviataAt !== s.inviataAt);
  if (fresh.length) toast(fresh.length === 1 ? `📲 Scheda ${fresh[0].label} aggiornata dal coach` : `📲 ${fresh.length} schede aggiornate dal coach`);
}

// ── LOGIN ──
async function login(raw) {
  const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const err = document.getElementById('err'), btn = document.getElementById('loginBtn');
  if (code.length < 6) { if (err) err.textContent = 'Inserisci il codice che ti ha mandato il coach'; return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Verifica…'; }
  initFirebase();
  try {
    if (!db) throw new Error('offline');
    const snap = await db.collection('app_clienti').doc(code).get({ source: 'server' });
    if (!snap.exists) throw new Error('notfound');
    state.code = code; state.data = snap.data();
    LS.set('code', code); LS.set('cache', state.data);
    // primo accesso: tutte le schede attuali risultano "nuove"
    history.replaceState(null, '', location.pathname);
    go('home'); listen(code);
  } catch (e) {
    if (err) err.textContent = e.message === 'notfound' ? 'Codice non valido. Controlla e riprova.' : 'Connessione assente. Riprova tra poco.';
    if (btn) { btn.disabled = false; btn.textContent = 'Accedi'; }
  }
}

function logout(silent) {
  const doIt = () => {
    if (unsub) { unsub(); unsub = null; }
    ['code','cache','seen','week','done'].forEach(k => LS.del(k));
    state.code = null; state.data = null; closeSheet(); go('home');
  };
  if (silent === true) return doIt();
  openSheet(`<h3>Esci</h3><p>Vuoi uscire? Per rientrare ti servirà di nuovo il codice del coach.</p>
    <button class="btn btn-accent" id="logoutOk">Esci</button><button class="btn btn-ghost" onclick="closeSheet()">Annulla</button>`);
  document.getElementById('logoutOk').onclick = doIt;
}

// ── NAVIGAZIONE ──
function go(view, schedaId) {
  state.view = view; state.schedaId = schedaId || null;
  if (view === 'scheda') history.pushState({ view, schedaId }, '', '#' + schedaId);
  render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => {
  const st = e.state;
  state.view = st && st.view === 'scheda' ? 'scheda' : 'home';
  state.schedaId = st ? st.schedaId : null;
  render();
});

function schedeList() {
  return Object.values((state.data && state.data.schede) || {})
    .sort((a, b) => (a.ordine ?? 0) - (b.ordine ?? 0) || String(a.label).localeCompare(String(b.label)));
}

// ── RENDER ──
function render() {
  const root = document.getElementById('root');
  if (!state.code) { root.innerHTML = renderLogin(); bindLogin(); return; }
  if (!state.data) { root.innerHTML = `<div class="loading">Caricamento…</div>`; return; }
  if (state.view === 'scheda') {
    const s = (state.data.schede || {})[state.schedaId];
    if (s) { root.innerHTML = renderScheda(s); markSeen(s); return; }
    state.view = 'home';
  }
  root.innerHTML = renderHome();
}

function renderLogin() {
  return `<div class="login">${LOGO}
    <h2>IAMSPINO</h2><div class="sub">COACHING</div>
    <p>Inserisci il codice di accesso che ti ha mandato il tuo coach per vedere le tue schede.</p>
    <input class="code-input" id="codeIn" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODICE">
    <div class="err" id="err"></div>
    <button class="btn btn-accent" id="loginBtn">Accedi</button>
  </div>`;
}
function bindLogin() {
  const inp = document.getElementById('codeIn');
  document.getElementById('loginBtn').onclick = () => login(inp.value);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') login(inp.value); });
}

function topBar(title, back) {
  return `<div class="top"><div class="wrap">
    ${back ? `<button class="icon-btn" onclick="history.back()" aria-label="Indietro">←</button>` : `<div style="width:32px;height:32px">${LOGO}</div>`}
    <h1>${title}</h1>
    <span class="sync ${online ? 'on' : ''}" title="${online ? 'Aggiornato' : 'Offline: dati salvati'}"></span>
    ${back ? '' : `<button class="icon-btn" style="width:auto;padding:0 10px;font-size:13px" onclick="logout()">Esci</button>`}
  </div></div>`;
}

function badgeFor(s) {
  const seen = LS.get('seen', {})[s.id];
  if (!seen) return `<span class="tag tag-new">Nuova</span>`;
  if (seen < (s.inviataAt || 0)) return `<span class="tag tag-upd">Aggiornata</span>`;
  return '';
}
function markSeen(s) {
  const seen = LS.get('seen', {});
  if (seen[s.id] !== s.inviataAt) { seen[s.id] = s.inviataAt || Date.now(); LS.set('seen', seen); }
}

function renderHome() {
  const d = state.data, list = schedeList();
  const h = new Date().getHours();
  const saluto = h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera';
  return `${topBar('IAMSPINO<small>COACHING</small>')}
  <div class="wrap">
    <div class="hello"><div class="hi">${saluto},</div><div class="name">${esc(d.nome || 'Atleta')} 💪</div></div>
    <div class="section-label">Le tue schede</div>
    ${list.length ? list.map(s => {
      const n = (s.esercizi || []).filter(e => has(e.nome)).length;
      const lbl = String(s.label || '?');
      return `<button class="scard" onclick="go('scheda','${esc(s.id)}')">
        <div class="lbl ${lbl.length > 3 ? 'long' : ''}">${esc(lbl)}</div>
        <div class="info">
          <div class="t">Scheda ${esc(lbl)} ${badgeFor(s)}</div>
          <div class="m">${n} esercizi${has(s.riscaldamento) ? ' · ⏱ ' + esc(s.riscaldamento) : ''}</div>
          <div class="m" style="font-size:12px;color:var(--muted)">Inviata il ${fmtDate(s.inviataAt)}</div>
        </div><div class="arrow">›</div></button>`;
    }).join('') : `<div class="empty"><div class="ico">📋</div>Non hai ancora schede.<br>Appena il coach te ne invia una la trovi qui.</div>`}
    ${installHint()}
  </div>`;
}

function installHint() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone || LS.get('hideInstall', false)) return '';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  return `<div class="warm" style="margin-top:20px;align-items:flex-start">
    <span style="font-size:22px">📱</span>
    <div style="flex:1;font-size:13px;color:var(--muted2);line-height:1.5"><b style="color:var(--text)">Installa l'app</b><br>
    ${ios ? 'Tocca <b>Condividi</b> ⬆️ e poi <b>Aggiungi a Home</b>.' : 'Apri il menu del browser ⋮ e scegli <b>Installa app</b> / <b>Aggiungi a schermata Home</b>.'}</div>
    <button class="icon-btn" style="width:28px;height:28px;font-size:14px" onclick="LS.set('hideInstall',true);render()">✕</button>
  </div>`;
}

// Settimane che hanno almeno un valore in qualche esercizio
function activeWeeks(s) {
  const out = [];
  for (let w = 0; w < 7; w++) {
    if ((s.esercizi || []).some(ex => has((ex.settimane || [])[w]) || (ex.kgRows || []).some(r => has((r || [])[w])))) out.push(w);
  }
  return out;
}
function currentWeek(s, weeks) {
  const saved = LS.get('week', {})[s.id];
  if (saved != null && weeks.includes(saved)) return saved;
  return weeks.length ? weeks[0] : 0;
}
function setWeek(sid, w) { const m = LS.get('week', {}); m[sid] = w; LS.set('week', m); render(); }

function doneKey(sid, w) { return sid + ':' + w + ':' + new Date().toISOString().slice(0, 10); }
function toggleDone(sid, w, exId) {
  const all = LS.get('done', {}), k = doneKey(sid, w);
  // tieni solo gli allenamenti di oggi
  Object.keys(all).forEach(key => { if (!key.endsWith(new Date().toISOString().slice(0, 10))) delete all[key]; });
  const arr = all[k] || [];
  const i = arr.indexOf(exId);
  if (i >= 0) arr.splice(i, 1); else arr.push(exId);
  all[k] = arr; LS.set('done', all);
  render();
  const s = state.data.schede[sid];
  const tot = (s.esercizi || []).filter(e => has(e.nome)).length;
  if (i < 0 && arr.length === tot && tot > 0) toast('🔥 Allenamento completato! Grande!');
}

function renderScheda(s) {
  const weeks = activeWeeks(s), w = currentWeek(s, weeks);
  const done = LS.get('done', {})[doneKey(s.id, w)] || [];
  const exs = (s.esercizi || []).filter(e => has(e.nome));
  const pct = exs.length ? Math.round(exs.filter(e => done.includes(e.id)).length / exs.length * 100) : 0;
  const showAll = LS.get('showTable', false);
  return `${topBar('Scheda ' + esc(s.label), true)}
  <div class="wrap">
    <div class="dhead"><div class="big">Scheda ${esc(s.label)}</div>
      <div class="sm">${exs.length} esercizi<br>agg. ${fmtDate(s.inviataAt)}</div></div>
    ${has(s.messaggio) ? `<div class="msg"><b>Messaggio dal coach</b>${esc(s.messaggio)}</div>` : ''}
    ${has(s.riscaldamento) ? `<div class="warm">🔥 <span>Riscaldamento: <b>${esc(s.riscaldamento)}</b></span></div>` : ''}
    ${has(s.note) ? `<div class="note">${esc(s.note)}</div>` : ''}
    ${weeks.length > 0 ? `<div class="weeks">
      <div class="lab"><span>Settimana</span><span>${pct}% completato oggi</span></div>
      <div class="chips">${weeks.map(i => `<button class="chip ${i === w ? 'on' : ''}" onclick="setWeek('${esc(s.id)}',${i})">Sett. ${i + 1}</button>`).join('')}</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
    </div>` : ''}
    ${exs.length ? exs.map((ex, i) => renderEx(s, ex, i, w, done.includes(ex.id), showAll)).join('')
      : `<div class="empty"><div class="ico">🏋️</div>Il coach sta ancora preparando gli esercizi.</div>`}
    ${exs.length ? `<button class="btn btn-ghost" style="margin-top:6px" onclick="LS.set('showTable',${!showAll});render()">
      ${showAll ? 'Nascondi' : 'Mostra'} tutte le settimane</button>` : ''}
  </div>`;
}

function renderEx(s, ex, i, w, isDone, showAll) {
  const sett = ex.settimane || [];
  const kgRows = (ex.kgRows || []).filter(r => (r || []).some(has));
  const kgW = kgRows.map(r => r[w]).filter(has);
  const rip = parseInt(ex.rip, 10);
  const video = safeUrl(ex.video);
  const chips = [];
  if (has(ex.tut)) chips.push(`<div class="stat"><div class="v">${esc(ex.tut)}″</div><div class="l">TUT</div></div>`);
  if (has(ex.rip)) chips.push(`<div class="stat"><div class="v">${esc(ex.rip)}″</div><div class="l">Recupero</div></div>`);
  if (has(ex.prep) && ex.prep !== '0') chips.push(`<div class="stat"><div class="v">${esc(ex.prep)}′</div><div class="l">Preparazione</div></div>`);
  return `<div class="ex ${isDone ? 'done' : ''}">
    <div class="ex-h">
      <div class="ex-n">${i + 1}</div>
      <div class="ex-t"><div class="nm">${esc(ex.nome)}</div>${ex.tipo && ex.tipo !== 'Singolo' ? `<span class="tp">${esc(ex.tipo)}</span>` : ''}</div>
      <button class="check" onclick="toggleDone('${esc(s.id)}',${w},'${esc(ex.id)}')" aria-label="Fatto">✓</button>
    </div>
    <div class="ex-main">
      <div class="stat"><div class="v y">${has(sett[w]) ? esc(sett[w]) : '—'}</div><div class="l">Serie × Rip · Sett. ${w + 1}</div></div>
      ${kgW.length ? `<div class="stat"><div class="kgs">${kgW.map(k => `<span>${esc(k)}</span>`).join('')}</div><div class="l">Kg</div></div>` : ''}
      ${chips.join('')}
    </div>
    ${has(ex.note) ? `<div class="ex-note">${esc(ex.note)}</div>` : ''}
    ${(video || rip > 0) ? `<div class="ex-actions">
      ${rip > 0 ? `<button class="pill y" onclick="Timer.start(${rip}, '${esc(String(ex.nome).replace(/['\\\\]/g, ' '))}')">⏱ Recupero ${rip}″</button>` : ''}
      ${video ? `<a class="pill" href="${esc(video)}" target="_blank" rel="noopener">▶ Video</a>` : ''}
    </div>` : ''}
    ${showAll ? fullTable(ex, w) : ''}
  </div>`;
}

function fullTable(ex, w) {
  const sett = ex.settimane || [];
  const kgRows = (ex.kgRows || []).filter(r => (r || []).some(has));
  const cols = [0, 1, 2, 3, 4, 5, 6];
  return `<div class="table-wrap"><table>
    <thead><tr><th></th>${cols.map(i => `<th class="${i === w ? 'cur' : ''}">S${i + 1}</th>`).join('')}</tr></thead>
    <tbody><tr><td>Serie</td>${cols.map(i => `<td class="${i === w ? 'cur' : ''}">${esc(sett[i] || '')}</td>`).join('')}</tr>
    ${kgRows.map((r, ri) => `<tr><td>Kg ${ri + 1}</td>${cols.map(i => `<td class="${i === w ? 'cur' : ''}">${esc(r[i] || '')}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
}

// ── TIMER RECUPERO ──
const Timer = (() => {
  let end = 0, iv = null, label = '';
  const el = () => document.getElementById('timer');
  function tick() {
    const left = Math.max(0, Math.round((end - Date.now()) / 1000));
    document.getElementById('timerVal').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    if (left <= 0) {
      clearInterval(iv); iv = null;
      el().classList.add('end');
      document.getElementById('timerLbl').textContent = 'Recupero finito! Vai 💪';
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
      beep();
      setTimeout(() => { if (!iv) stop(); }, 6000);
    }
  }
  function start(sec, name) {
    label = name; end = Date.now() + sec * 1000;
    el().classList.remove('end'); el().classList.add('show');
    document.getElementById('timerLbl').textContent = 'Recupero · ' + name;
    clearInterval(iv); iv = setInterval(tick, 250); tick();
  }
  function add(sec) { if (!iv) return start(sec, label); end += sec * 1000; tick(); }
  function stop() { clearInterval(iv); iv = null; el().classList.remove('show', 'end'); }
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, .35].forEach(t => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(.25, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .3);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .3);
      });
    } catch (e) {}
  }
  return { start, add, stop };
})();

// ── UI UTILS ──
let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 3200);
}
function openSheet(html) { document.getElementById('sheetBox').innerHTML = html; document.getElementById('sheet').classList.add('show'); }
function closeSheet() { document.getElementById('sheet').classList.remove('show'); }

// ── AVVIO ──
(function init() {
  const urlCode = new URLSearchParams(location.search).get('c');
  if (urlCode && urlCode.toUpperCase() !== state.code) {
    render();
    const inp = document.getElementById('codeIn');
    if (inp) inp.value = urlCode.toUpperCase();
    login(urlCode);
  } else {
    if (location.search) history.replaceState(null, '', location.pathname);
    history.replaceState({ view: 'home' }, '', location.pathname);
    render();
    if (state.code) listen(state.code);
  }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
